name: Protect Branches

on:
  push:
    branches:
      - main
      - develop

jobs:
  block-agent-push:
    runs-on: ubuntu-latest
    # Only run on direct pushes, not merge commits from PRs
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: Check if push is from a merged PR (squash/merge commit)
        id: check_pr
        if: github.event_name == 'push'
        run: |
          # For merge commits, GitHub creates a merge commit with message "Merge pull request #X"
          # For squash merges, the commit message is the PR title and we can check via API
          if [[ "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]]; then
            echo "Merge commit from PR detected, allowing push"
            echo "is_merge=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For non-merge commits, check if this commit is associated with a PR
          # via the GitHub API (commits/<sha>/pulls)
          PRS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq 'length' 2>/dev/null || echo 0)
          if [[ "$PRS" -gt 0 ]]; then
            echo "Commit is part of a PR (#${PRS}), allowing push"
            echo "is_merge=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "is_merge=false" >> $GITHUB_OUTPUT

      - name: Block direct pushes to protected branches
        if: steps.check_pr.outputs.is_merge != 'true'
        run: |
          echo "Direct push to ${{ github.ref_name }} detected from actor: ${{ github.actor }}"
          echo "Direct pushes to main/develop are forbidden. Use PR workflow."
          echo "If you are an automated agent, ensure you push to a feature branch and open a PR."
          exit 1