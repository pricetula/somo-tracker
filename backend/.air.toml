root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  full_bin = ""
  watch = true
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml", "sql"]
  exclude_dir = ["bin", "tmp", "migrations", "vendor"]
  include_dir = []
  log = "build-errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true

[misc]
  clean_on_exit = true