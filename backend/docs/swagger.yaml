basePath: /api
definitions:
  internal_api.deleteAdminsRequest:
    properties:
      user_ids:
        items:
          type: string
        type: array
    type: object
  somotracker_backend_internal_services.AcademicPeriodRequest:
    properties:
      terms:
        items:
          $ref: '#/definitions/somotracker_backend_internal_services.TermInput'
        type: array
      year:
        type: integer
    type: object
  somotracker_backend_internal_services.AdminListItem:
    properties:
      accepted_at:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      invited_at:
        type: string
      is_active:
        type: boolean
      membership_id:
        type: string
      user_id:
        type: string
    type: object
  somotracker_backend_internal_services.AdminListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/somotracker_backend_internal_services.AdminListItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  somotracker_backend_internal_services.TermInput:
    properties:
      end_date:
        type: string
      name:
        type: string
      start_date:
        description: '"2026-01-15"'
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Platform team
  description: Backend REST API for Somotracker educational dashboard
  license:
    name: MIT
  termsOfService: http://somotracker.local/terms
  title: Somotracker API
  version: 1.0.0
paths:
  /admins:
    delete:
      consumes:
      - application/json
      description: |-
        List school admins with pagination and filters (invited/accepted)
        Delete school members by user IDs; returns error if current user is included
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50)
        in: query
        name: limit
        type: integer
      - description: Search email or full name
        in: query
        name: search
        type: string
      - description: 'Filter by invitation status: invited|accepted|all (default all)'
        in: query
        name: invitation_status
        type: string
      - description: User IDs to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.deleteAdminsRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      summary: Delete members
      tags:
      - Admins
      - Admins
    get:
      consumes:
      - application/json
      description: |-
        List school admins with pagination and filters (invited/accepted)
        Delete school members by user IDs; returns error if current user is included
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50)
        in: query
        name: limit
        type: integer
      - description: Search email or full name
        in: query
        name: search
        type: string
      - description: 'Filter by invitation status: invited|accepted|all (default all)'
        in: query
        name: invitation_status
        type: string
      - description: User IDs to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.deleteAdminsRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      - ApiKeyAuth: []
      summary: Delete members
      tags:
      - Admins
      - Admins
  /api/auth/callback:
    get:
      consumes:
      - application/json
      parameters:
      - description: Magic-link token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate magic-link token
      tags:
      - Auth
  /api/auth/invite/callback:
    get:
      consumes:
      - application/json
      parameters:
      - description: Invitation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to frontend
      summary: Accept invitation and create session
      tags:
      - Auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout and revoke session
      tags:
      - Auth
  /api/auth/magic-link/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: Organization ID or slug
        in: query
        name: org_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send magic-link email
      tags:
      - Auth
  /api/me:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get current user
      tags:
      - User
  /api/school:
    post:
      consumes:
      - application/json
      description: Creates a new school. Requester must be admin. Auto-creates 3 terms
        + loads CBE curriculum.
      parameters:
      - description: School creation payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
      summary: Create school (admin-only)
      tags:
      - Schools
  /api/school/academic-period:
    post:
      consumes:
      - application/json
      description: Creates a new academic year with nested terms for the active school.
      parameters:
      - description: Academic period payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/somotracker_backend_internal_services.AcademicPeriodRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Create academic period
      tags:
      - Academic Periods
  /school/grades:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Get grade levels
      tags:
      - Grades
  /school/register:
    post:
      consumes:
      - application/json
      description: Creates a new school for the authenticated user and assigns them
        as ADMIN. Updates user's full_name atomically.
      parameters:
      - description: School registration payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Register a new school
      tags:
      - Schools
  /school/set-active:
    post:
      consumes:
      - application/json
      description: Updates the user's active school in DB and session.
      parameters:
      - description: Active school payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Set active school
      tags:
      - Schools
  /school/streams:
    post:
      consumes:
      - application/json
      description: Creates one or more streams for the active school.
      parameters:
      - description: Stream names
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Create streams
      tags:
      - Streams
swagger: "2.0"
