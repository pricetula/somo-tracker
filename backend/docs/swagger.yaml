basePath: /api
definitions:
  services.AcademicPeriodRequest:
    properties:
      terms:
        items:
          $ref: '#/definitions/services.TermInput'
        type: array
      year:
        type: integer
    type: object
  services.TermInput:
    properties:
      end_date:
        type: string
      name:
        type: string
      start_date:
        description: '"2026-01-15"'
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Platform team
  description: Backend REST API for Somotracker educational dashboard
  license:
    name: MIT
  termsOfService: http://somotracker.local/terms
  title: Somotracker API
  version: 1.0.0
paths:
  /api/auth/callback:
    get:
      consumes:
      - application/json
      parameters:
      - description: Magic-link token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate magic-link token
      tags:
      - Auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout and revoke session
      tags:
      - Auth
  /api/auth/magic-link/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: Organization ID or slug
        in: query
        name: org_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send magic-link email
      tags:
      - Auth
  /api/me:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get current user
      tags:
      - User
  /school/academic-period:
    post:
      consumes:
      - application/json
      description: Creates a new academic year with nested terms for the active school.
      parameters:
      - description: Academic period payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services.AcademicPeriodRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Create academic period
      tags:
      - Academic Periods
  /school/register:
    post:
      consumes:
      - application/json
      description: Creates a new school for the authenticated user and assigns them
        as ADMIN. Updates user's full_name atomically.
      parameters:
      - description: School registration payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Register a new school
      tags:
      - Schools
  /school/streams:
    post:
      consumes:
      - application/json
      description: Creates one or more streams for the active school.
      parameters:
      - description: Stream names
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Create streams
      tags:
      - Streams
swagger: "2.0"
