services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: somotracker
      POSTGRES_USER: somotracker
      POSTGRES_PASSWORD: somotracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somotracker -d somotracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CSP_REPORT_ONLY_ENABLED: ${CSP_REPORT_ONLY_ENABLED}
      CSP_REPORT_ONLY_POLICY: ${CSP_REPORT_ONLY_POLICY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
      EMAIL_PROVIDER_HOURLY_CAP: ${EMAIL_PROVIDER_HOURLY_CAP}
      EMAIL_PROVIDER_DAILY_CAP: ${EMAIL_PROVIDER_DAILY_CAP}
      RATE_LIMIT_MAGIC_LINK_IP_PER_MIN: ${RATE_LIMIT_MAGIC_LINK_IP_PER_MIN}
      RATE_LIMIT_MAGIC_LINK_EMAIL_PER_15_MIN: ${RATE_LIMIT_MAGIC_LINK_EMAIL_PER_15_MIN}
      RATE_LIMIT_TOKEN_EXCHANGE_IP_PER_MIN: ${RATE_LIMIT_TOKEN_EXCHANGE_IP_PER_MIN}
      STYTCH_PROJECT_ID: ${STYTCH_PROJECT_ID}
      STYTCH_SECRET: ${STYTCH_SECRET}
      STYTCH_ENV: ${STYTCH_ENV}
      EMAIL_HMAC_KEY: ${EMAIL_HMAC_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
    ports:
      - "3030:3030"
    volumes:
      - ./backend:/app
      - /app/bin
      - ./backend/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3030/healthz",
        ]
      interval: 5m
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Internal backend URL for server-side API calls (BFF)
      PUBLIC_API_URL: http://backend:3030
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      NODE_ENV: ${NODE_ENV}
      HOSTNAME: ${HOSTNAME}
      PORT: 3000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      APP_ENV: ${APP_ENV}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
