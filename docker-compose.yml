services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: somotracker
      POSTGRES_USER: somotracker
      POSTGRES_PASSWORD: somotracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somotracker -d somotracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      CORS_ORIGINS: ${PUBLIC_APP_URL}
      CSP_REPORT_ONLY_ENABLED: "false"
      CSP_REPORT_ONLY_POLICY: default-src 'self'
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://somotracker:somotracker@postgres:5432/somotracker?sslmode=disable}
      REDIS_ADDR: redis:6379
      SERVER_PORT: 8080
      EMAIL_PROVIDER_HOURLY_CAP: "1000"
      EMAIL_PROVIDER_DAILY_CAP: "10000"
      RATE_LIMIT_MAGIC_LINK_IP_PER_MIN: "10"
      RATE_LIMIT_MAGIC_LINK_EMAIL_PER_15_MIN: "3"
      RATE_LIMIT_TOKEN_EXCHANGE_IP_PER_MIN: "10"
      STYTCH_PROJECT_ID: ${STYTCH_PROJECT_ID}
      STYTCH_SECRET: ${STYTCH_SECRET}
      STYTCH_ENV: ${STYTCH_ENV:-test}
      EMAIL_HMAC_KEY: ${EMAIL_HMAC_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/bin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: ${PUBLIC_API_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: