openapi: 3.1.0
info:
  title: Somotracker API
  version: 0.1.0
  description: Somotracker API for B2B Magic-Link Authentication, Resumable Onboarding and Opaque Sessions
servers:
  - url: https://api.example.com
paths:
  /api/v1/auth/request-magic-link:
    post:
      summary: Request a Stytch Discovery magic link
      operationId: requestMagicLink
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMagicLinkRequest'
      responses:
        '200':
          description: Generic success (no account enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestMagicLinkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            headers:
              Retry-After:
                schema:
                  type: integer
                description: Seconds until next allowed request
  /api/v1/auth/authenticate-token:
    post:
      summary: Authenticate Stytch Discovery magic link token
      operationId: authenticateToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateTokenRequest'
      responses:
        '200':
          description: Authentication result with onboarding state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateTokenResponse'
        '400':
          description: Invalid request or missing PKCE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/onboarding/current:
    get:
      summary: Get current onboarding state
      operationId: getOnboardingCurrent
      tags:
        - Onboarding
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStateResponse'
        '401':
          description: No onboarding session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update current onboarding step and form data
      operationId: updateOnboardingCurrent
      tags:
        - Onboarding
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnboardingRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No onboarding session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/onboarding/complete:
    post:
      summary: Complete onboarding and provision tenant
      operationId: provisionTenant
      tags:
        - Onboarding
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
      responses:
        '200':
          description: Tenant provisioned, session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionTenantResponse'
        '400':
          description: Invalid request or missing ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Provisioning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reference/countries:
    get:
      summary: List all countries
      tags:
        - Reference
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reference/education-systems:
    get:
      summary: List education systems for a country
      tags:
        - Reference
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: country_id
          required: true
          schema:
            type: string
            format: uuid
          description: Country UUID
      responses:
        '200':
          description: List of education systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EducationSystem'
        '400':
          description: Invalid country_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Logout and revoke session
      operationId: logout
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    get:
      summary: Get current user profile
      operationId: getMe
      tags:
        - Identity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/active-school:
    put:
      summary: Switch active school membership
      operationId: switchActiveSchool
      tags:
        - Identity
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchActiveSchoolRequest'
      responses:
        '200':
          description: Active school switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchActiveSchoolResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/schools:
    get:
      summary: List schools in tenant
      operationId: listSchools
      tags:
        - Identity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolRef'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/students:
    get:
      summary: List students with keyset pagination
      operationId: listStudents
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor from previous page
        - name: sort
          in: query
          schema:
            type: string
            default: name_asc
          description: Sort order
        - name: guardianId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by guardian membership ID
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStudentsResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a student
      operationId: createStudent
      tags:
        - Students
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Admission number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/students/{id}:
    get:
      summary: Get a single student
      operationId: getStudent
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDTO'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a student (full body)
      operationId: updateStudent
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDTO'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Admission number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Soft-delete a student
      operationId: deleteStudent
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
      responses:
        '204':
          description: Student deleted
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/students/{id}/guardians:
    get:
      summary: List guardians linked to a student
      operationId: listGuardianLinks
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
      responses:
        '200':
          description: Guardian links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardianLinkDTO'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Link a guardian to a student
      operationId: createGuardianLink
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianLinkRequest'
      responses:
        '201':
          description: Guardian linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLinkDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/students/{id}/guardians/{guardian_id}:
    delete:
      summary: Unlink a guardian from a student
      operationId: deleteGuardianLink
      tags:
        - Students
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Student ID
        - name: guardian_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Guardian membership ID
      responses:
        '204':
          description: Guardian unlinked
        '404':
          description: Guardian link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Secure-session_token
  schemas:
    RequestMagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User email address
    RequestMagicLinkResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always true (no account enumeration)
    AuthenticateTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: One-time Stytch Discovery token from URL
    AuthenticateTokenResponse:
      type: object
      properties:
        status:
          type: string
          description: Current onboarding step (deprecated, use auth_state)
        auth_state:
          type: string
          enum:
            - onboarding_required
            - organization_selection_required
            - authenticated
          description: Authentication state based on discovered organizations
        ticket_token:
          type: string
          description: Short-lived onboarding ticket token (also set in __Host-onboarding cookie)
        onboarding:
          $ref: '#/components/schemas/OnboardingState'
    OnboardingState:
      type: object
      properties:
        verified_email:
          type: string
          format: email
        current_step:
          type: string
        form_data:
          type: object
          additionalProperties: true
        pending_id:
          type: string
          format: uuid
        school_name:
          type: string
          nullable: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
    OnboardingStateResponse:
      type: object
      properties:
        verified_email:
          type: string
          format: email
        current_step:
          type: string
        form_data:
          type: object
          additionalProperties: true
        pending_id:
          type: string
          format: uuid
        school_name:
          type: string
          nullable: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
    UpdateOnboardingRequest:
      type: object
      required:
        - current_step
      properties:
        current_step:
          type: string
        form_data:
          type: object
          additionalProperties: true
        school_name:
          type: string
    ProvisionTenantRequest:
      type: object
      required:
        - school_name
        - idempotency_key
        - country_id
        - education_system_id
      properties:
        school_name:
          type: string
          minLength: 1
          maxLength: 255
        idempotency_key:
          type: string
        country_id:
          type: string
          format: uuid
          description: Country UUID for the school
        education_system_id:
          type: string
          format: uuid
          description: Education system UUID for the school
    ProvisionTenantResponse:
      type: object
      properties:
        success:
          type: boolean
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
    MeResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
        active_school:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        schools:
          type: array
          items:
            $ref: '#/components/schemas/SchoolRef'
    SchoolRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SwitchActiveSchoolRequest:
      type: object
      required:
        - school_id
      properties:
        school_id:
          type: string
          format: uuid
    SwitchActiveSchoolResponse:
      type: object
      properties:
        success:
          type: boolean
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
        country_name:
          type: string
        country_code:
          type: string
    EducationSystem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        country_id:
          type: string
          format: uuid
        system_name:
          type: string
        description:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    StudentDTO:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        admission_number:
          type: string
        national_number:
          type: string
          nullable: true
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListStudentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentDTO'
        nextCursor:
          type: string
          nullable: true
    CreateStudentRequest:
      type: object
      required:
        - admission_number
        - full_name
        - date_of_birth
        - gender
      properties:
        admission_number:
          type: string
        national_number:
          type: string
          nullable: true
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        metadata:
          type: object
          additionalProperties: true
    UpdateStudentRequest:
      type: object
      required:
        - admission_number
        - full_name
        - date_of_birth
        - gender
      properties:
        admission_number:
          type: string
        national_number:
          type: string
          nullable: true
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        metadata:
          type: object
          additionalProperties: true
    GuardianLinkDTO:
      type: object
      properties:
        guardian_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        relationship_type:
          type: string
        is_emergency_contact:
          type: boolean
    GuardianLinkRequest:
      type: object
      required:
        - relationship_type
      properties:
        relationship_type:
          type: string
        is_emergency_contact:
          type: boolean