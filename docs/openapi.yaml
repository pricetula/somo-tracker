openapi: 3.0.3
info:
  title: Somotracker API
  description: |
    Backend REST API for Somotracker educational dashboard.
    Spec-first design: this file drives both Go Fiber handlers and TypeScript clients.
  version: 1.0.0
  contact:
    name: Platform team
  license:
    name: MIT
servers:
  - url: /api
    description: Default server (proxied through Next.js /backend rewrite)
paths:
  /me:
    get:
      tags: [User]
      summary: Get current user
      security: [{ApiKeyAuth: []}]
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /auth/magic-link/send:
    post:
      tags: [Auth]
      summary: Send magic-link email
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request

  /auth/callback:
    get:
      tags: [Auth]
      summary: Authenticate magic-link token
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request

  /school/academic-period:
    get:
      tags: [Academic Periods]
      summary: List academic periods
      security: [{ApiKeyAuth: []}]
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

    post:
      tags: [Academic Periods]
      summary: Create academic period
      security: [{ApiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPeriodRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized

  /students:
    get:
      tags: [Students]
      summary: List students
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /students/{id}:
    get:
      tags: [Students]
      summary: Get student by ID
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found

    patch:
      tags: [Students]
      summary: Update student
      security: [{ApiKeyAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: session

  schemas:
    AcademicPeriodRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        year_start:
          type: integer
        year_end:
          type: integer
        terms:
          type: array
          items: { $ref: '#/components/schemas/Term' }
    Term:
      type: object
      properties:
        label:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

tags:
  - name: Auth
  - name: User
  - name: Schools
  - name: Academic Periods
  - name: Students
  - name: Teachers
  - name: Classes
  - name: Attendance
  - name: Events
  - name: Admins
  - name: Guardians
  - name: Finance
